      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#f26b1d"/>
    </linearGradient>
    <radialGradient id="b-glow" cx="0.22" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#ffb26b" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffd7b5" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#f5f4f2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b-glow2" cx="0.92" cy="1" r="0.6">
