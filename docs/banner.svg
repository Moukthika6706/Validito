    <text x="366" y="290" font-size="34" font-weight="500" fill="#57534e" font-family="Inter, 'Segoe UI', Arial, sans-serif">Term-sheet validation you can audit.</text>
    <text x="366" y="338" font-size="22" fill="#8a8580" font-family="Inter, 'Segoe UI', Arial, sans-serif">Extract the clauses, run the rule packs, score the anomalies, explain every flag, route only the doubtful ones to a human.</text>
