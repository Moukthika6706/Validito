    <g stroke="#1c1917" stroke-opacity="0.05" stroke-width="1">
      <path d="M0 110H1600M0 220H1600M0 330H1600"/>
      <path d="M400 0V440M800 0V440M1200 0V440"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1599" height="439" rx="28" fill="none" stroke="#1c1917" stroke-opacity="0.1"/>

  <!-- mark -->
  <g transform="translate(96 112) scale(1.8)">
    <rect x="3" y="3" width="114" height="114" rx="28" fill="#faf9f7" stroke="#1c1917" stroke-opacity="0.1" stroke-width="2"/>
    <path d="M38 28h28l18 18v44a6 6 0 0 1-6 6H38a6 6 0 0 1-6-6V34a6 6 0 0 1 6-6z" fill="#ffffff" stroke="#1c1917" stroke-width="3" stroke-linejoin="round"/>
